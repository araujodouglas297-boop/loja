<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Carrinho | CarvaImportes</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>


<header class="header">

    <a href="./index.html" class="logo">
        CARVA<span>IMPORTES</span>
    </a>

    <nav class="menu">

        <a href="./index.html">
            Continuar comprando
        </a>

        <a href="./carrinho.html" class="cart-link">

            🛒 Carrinho

            <span id="contadorCarrinho">
                0
            </span>

        </a>

    </nav>

</header>


<main class="carrinho-page">


    <div class="page-title">

        <span>
            SEU PEDIDO
        </span>

        <h1>
            Carrinho
        </h1>

    </div>


    <div class="carrinho-layout">


        <div
            id="listaCarrinho"
            class="lista-carrinho">
        </div>


        <aside class="resumo-carrinho">


            <h2>
                Resumo
            </h2>


            <div>

                <span>
                    Subtotal
                </span>

                <strong id="subtotal">
                    R$ 0,00
                </strong>

            </div>


            <div>

                <span>
                    Frete
                </span>

                <span>
                    A combinar
                </span>

            </div>


            <hr>


            <div class="resumo-total">

                <strong>
                    Total
                </strong>

                <strong id="totalCarrinho">
                    R$ 0,00
                </strong>

            </div>


            <a
                href="./checkout.html"
                class="btn-checkout"
                id="btnFinalizarCompra">

                FINALIZAR COMPRA

            </a>


            <a
                href="./index.html"
                class="continuar-comprando">

                ← Continuar comprando

            </a>


        </aside>

    </div>

</main>


<script src="./js/script.js"></script>

</body>
</html>
